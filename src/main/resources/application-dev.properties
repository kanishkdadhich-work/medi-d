# Database Connection - Pulling from .env / environment with dev defaults
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medid_db}
spring.datasource.username=${DB_USER:logi_admin}
spring.datasource.password=${DB_PASSWORD:track_pass_2026}

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
