spring.application.name=medi-d

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

logging.level.com.medid=INFO

# JWT hardening defaults: short-lived access token + refresh token rotation.
security.jwt.secret=${JWT_SECRET:MediD_Secret_Key_2026_Secure_Long_String_For_HS256}
security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
